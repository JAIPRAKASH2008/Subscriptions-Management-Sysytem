<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found — Brightloop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-app);">
  <div style="text-align: center; max-width: 440px; padding: 40px; background: #ffffff; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1px solid var(--border-default);">
    <div class="brand-glyph" style="margin: 0 auto 20px; width: 48px; height: 48px; font-size: 1.5rem;">B</div>
    <h1 style="font-size: 3rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">404</h1>
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">Resource Not Found</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">The subscription endpoint or view you requested is unavailable or has moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-block">Return to Workspace</a>
  </div>
</body>
</html>
